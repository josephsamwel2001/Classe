<!-- policy_form.html -->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Policy Creation Form</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <div class="policy-card">
            <div class="header">
                <h1>Masese</h1>
                <p>INSURANCE</p>
            </div>
            <h2>Policy Creation Form</h2>
            <form id="policyForm">
                <div class="input-group">
                    <label for="customerName">Customer Name</label>
                    <input type="text" id="customerName" required>
                </div>
                
                <div class="input-group">
                    <label for="policyNumber">Policy Number</label>
                    <input type="text" id="policyNumber" required>
                </div>
                
                <div class="input-group">
                    <label for="policyType">Policy Type</label>
                    <select id="policyType" required>
                        <option value="">Select Policy Type</option>
                        <option value="auto">Auto Insurance</option>
                        <option value="health">Health Insurance</option>
                        <option value="life">Life Insurance</option>
                        <option value="home">Home Insurance</option>
                    </select>
                </div>
                
                <div class="input-group">
                    <label for="premiumAmount">Premium Amount ($)</label>
                    <input type="number" id="premiumAmount" min="100" max="10000" step="100" required>
                </div>
                
                <div class="input-group">
                    <label for="startDate">Start Date</label>
                    <input type="date" id="startDate" required>
                </div>
                
                <div class="input-group">
                    <label for="endDate">End Date</label>
                    <input type="date" id="endDate" required>
                </div>
                
                <div class="input-group">
                    <label for="coverageAmount">Coverage Amount ($)</label>
                    <input type="number" id="coverageAmount" min="1000" step="1000" required>
                </div>
                
                <div class="input-group">
                    <label for="status">Policy Status</label>
                    <select id="status" required>
                        <option value="active">Active</option>
                        <option value="pending">Pending</option>
                        <option value="expired">Expired</option>
                        <option value="cancelled">Cancelled</option>
                    </select>
                </div>
                
                <div class="actions">
                    <button type="submit" class="btn-submit">Create Policy</button>
                    <button type="button" class="btn-cancel" id="cancelBtn">Cancel</button>
                </div>
            </form>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
